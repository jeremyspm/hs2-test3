<style>
/* ── estate tokens (house.css contract, dark default) ─────────────── */
:root{
  --bg:hsl(225 33% 5%); --fg:hsl(225 31% 95%); --card:hsl(224 44% 10%);
  --primary:hsl(218 91% 64%); --onprimary:hsl(225 33% 5%);
  --muted:hsl(220 38% 13%); --muted-fg:hsl(218 19% 67%);
  --accent:hsl(219 40% 18%); --danger:hsl(0 84% 60%); --ok:hsl(158 64% 42%);
  --warn:hsl(38 92% 55%); --border:hsl(222 27% 19%); --radius:.625rem;
  --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme=light]{
  --bg:hsl(214 47% 97%); --fg:hsl(222 47% 11%); --card:hsl(0 0% 100%);
  --onprimary:#fff; --muted:hsl(215 40% 93%); --muted-fg:hsl(220 12% 40%);
  --accent:hsl(216 45% 91%); --border:hsl(215 33% 89%); --warn:hsl(38 92% 40%);
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:1rem;margin:0;flex:1;font-weight:700}
header .d{color:var(--muted-fg);font-size:.8rem;white-space:nowrap}
/* phone: title over countdown on the left, buttons full height on the right (was one flex row: the title got squeezed to a word per line) */
@media(max-width:560px){
  header{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:0 8px;padding:8px 12px}
  header h1{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .d{grid-area:2/1;white-space:normal;font-size:.76rem;line-height:1.3}
  header .btn{grid-row:1/span 2;padding:8px 10px;min-width:40px}
}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border:1px solid var(--border);background:var(--muted);color:var(--fg);
  border-radius:var(--radius);padding:10px 14px;font:inherit;font-weight:600;
  transition:background var(--dur) var(--ease)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:8px}
a.btn{text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.door h2{margin:.1rem 0 .3rem;font-size:1.02rem}
.door p{margin:.2rem 0 .6rem;color:var(--muted-fg);font-size:.88rem}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
/* a quiz row: tag + name, then count + Learn + Sit as one group that drops to a
   second line at phone width instead of squeezing the name into four lines */
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 10px;background:var(--muted)}
.qrow b{flex:1 1 150px;font-size:.86rem;font-weight:600}
.qrow .m{color:var(--muted-fg);font-size:.76rem;white-space:nowrap}
.qrow .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.sysrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
/* quiz selection: tick any rows (or a whole system) and the bottom bar runs them as one */
.qrow{cursor:pointer}
.qrow.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.qrow>input.pk{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:var(--primary);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:.8rem;color:var(--muted-fg)}
.chip{border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:transparent;color:var(--fg);
  cursor:pointer;font:inherit;font-size:.8rem;font-weight:600;line-height:1.3}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary)}
.footbar .btn.x{flex:0 0 auto}
/* ── focus checklist ─────────────────────────────────────────────────── */
.fhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:2px 0 8px}
.fbar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden;flex:1 1 140px;min-width:120px}
.fbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ftier{font-weight:700;font-size:.82rem;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.ftier b{font-weight:700}
.ftier .fnum{font-weight:400;color:var(--muted-fg)}
.frow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--muted);
  border-left:3px solid var(--tc,var(--border))}
.frow.on{opacity:.62}
.frow.on .ft{text-decoration:line-through}
.frow>input.fchk{flex:0 0 auto;width:18px;height:18px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.fbody{flex:1 1 auto;min-width:0}
.fbody>summary{cursor:pointer;list-style:none;display:block}
.fbody>summary::-webkit-details-marker{display:none}
.ft{font-weight:650;font-size:.92rem;display:block}
.fmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fchip{font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-fg);white-space:nowrap}
.fchip.her{background:hsl(38 92% 55% / .18);color:var(--warn)}
.fchip.tape{background:hsl(0 84% 60% / .16);color:var(--danger)}
.fchip.saq{background:hsl(218 91% 64% / .16);color:var(--primary)}
.fchip.sys{background:transparent;border:1px solid var(--border)}
.fchip.hl{background:hsl(158 64% 42% / .2);color:var(--ok);font-weight:650}
.fchip.rev{background:hsl(158 64% 42% / .12);color:var(--ok)}
.fchip.kh{background:hsl(280 60% 60% / .16);color:hsl(280 70% 72%)}
.hlans{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.hlans>summary{cursor:pointer;padding:7px 10px;font-weight:650;font-size:.84rem;color:var(--ok);list-style:none}
.hlans>summary::-webkit-details-marker{display:none}
.hlans .hlbody{padding:0 10px 10px;font-size:.83rem;line-height:1.55;white-space:pre-wrap}
.hlans .hlh{font-weight:700;margin:8px 0 4px;font-size:.8rem;letter-spacing:.02em}
.fdet{font-size:.85rem;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.fdet p{margin:0 0 7px}
.fdet .fcap{color:var(--muted-fg)}
.fwhy{font-size:.8rem;line-height:1.5;color:var(--muted-fg);margin:0 0 4px}
@media(max-width:400px){ .ft{font-size:.88rem} .fdet{font-size:.82rem} }
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--muted-fg)}
.tag.repro{color:hsl(335 85% 72%)}.tag.gen{color:hsl(268 80% 74%)}.tag.senses{color:hsl(38 92% 62%)}
.tag.mixed{color:var(--muted-fg)}
/* sitting */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .n{font-weight:700}
.qhead .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted-fg)}
.qhead .timer.low{color:var(--danger);font-weight:700}
.stem{white-space:pre-wrap;margin-bottom:10px}
.stem img,.qimg{max-width:100%;border-radius:8px;background:#fff;display:block;margin:8px 0}
/* structured stem: her paragraphs, lists and table rows survive; a Canvas layout
   table becomes stacked cells at phone width and side-by-side from 560px */
.stem.rich{white-space:normal;line-height:1.5}
.stem.rich p{margin:.4em 0}
.stem.rich ul,.stem.rich ol{margin:.3em 0;padding-left:1.35em}
.stem.rich li{margin:.15em 0}
.stem.rich li>p{margin:.1em 0}
.stem.rich div{margin:.15em 0}
.stem.rich .tbl{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.stem.rich .tr{display:flex;flex-wrap:wrap;gap:8px 14px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--muted)}
.stem.rich .td{flex:1 1 220px;min-width:0}
.stem.rich .td>p:first-child{margin-top:0}
.stem.rich .td img{margin:0 0 4px;max-height:280px;width:auto}
.stem.rich img{max-height:520px;width:auto}
.inl{display:inline-block;width:auto;max-width:100%;padding:5px 8px;margin:2px 0;vertical-align:baseline;
  font-size:.95em;border:1px solid var(--primary);background:var(--card);color:var(--fg);border-radius:6px}
input.inl{min-width:7ch}
.inl:focus{outline:2px solid var(--primary);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin:6px 0;cursor:pointer;background:var(--muted)}
.opt input{margin-top:3px;flex:none}
.opt.sel{border-color:var(--primary);background:var(--accent)}
/* learn mode: a checked question locks and colours itself in place */
.opt.k{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.x{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.opt.lock{cursor:default}
.lres{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.lres .hint{font-size:.76rem;color:var(--muted-fg)}
.lres .qr-pane{flex-basis:100%;padding:6px 0 0}
.mk .verdict{font-weight:700;margin:0 0 4px}
.mk.right .verdict{color:var(--ok)} .mk.wrong .verdict{color:var(--danger)} .mk.saq{border-color:var(--primary)}
.pip.ok{background:var(--ok);border-color:var(--ok)} .pip.bad{background:var(--danger);border-color:var(--danger)}
.qrow .btn{padding:6px 10px;font-size:.8rem}
.qrow .btn.learn{border-color:var(--primary);color:var(--primary)}
.blankrow{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blankrow label{font-size:.82rem;color:var(--muted-fg)}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--muted);
  border:1px solid var(--border);border-radius:8px;padding:9px;width:100%}
textarea{min-height:120px}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin:10px 0 2px}
.pip{width:14px;height:6px;border-radius:3px;background:var(--muted);border:1px solid var(--border)}
.pip.done{background:var(--primary);border-color:var(--primary)}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
/* marking */
.mk{border-left:4px solid var(--border);padding-left:10px;margin:14px 0}
.mk.right{border-color:var(--ok)}.mk.wrong{border-color:var(--danger)}
.mk .you{color:var(--muted-fg);font-size:.9rem}
.mk .keyline{color:var(--ok);font-weight:600}
.mk .marks{font-size:.8rem;color:var(--muted-fg)}
.steps label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.refq{font-size:.85rem;color:var(--muted-fg);margin:8px 0 2px;padding:8px 10px;background:var(--muted);border-radius:8px}
.refq.slide{padding:6px}
.refq.patton{border-left:3px solid var(--primary)}
.refq i{color:var(--fg)}
.slideimg{max-width:100%;background:#fff;border-radius:6px;display:block;margin:0 0 4px}
.keyrows{margin:6px 0}
.krow{font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--border)}
.krow b{color:var(--ok);font-weight:600}
.krow.kok{opacity:.55}
.kyou{color:var(--danger);font-size:.78rem}
.kref{font-size:.84rem;color:var(--muted-fg);margin:4px 0 6px 14px;padding:6px 10px;background:var(--muted);border-radius:8px;line-height:1.45}
.kref i{color:var(--fg)}
.kref .refsrc{display:inline}
.refsrc{font-size:.74rem;color:var(--muted-fg);opacity:.8}
.vidrow{font-size:.86rem;margin:6px 0}
.vidrow a{font-weight:600}
.askai{padding:3px 10px;font-size:.76rem;margin-top:6px}
.learnrow{padding:7px 12px;font-size:.84rem;margin-top:6px}
.aiwrap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:8px 0 4px}
.aitext{flex-basis:100%;width:100%;min-height:150px;font-size:.78rem;margin-top:6px}
.aisplit{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.aisplit .askai{margin-top:0}
.vclip{margin:.5rem 0}
.vframe{position:relative;aspect-ratio:16/9;width:100%;max-width:460px;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.vframe img,.vframe iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
.vplay{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(20,20,28,.72);color:#fff;border:2px solid #fff;font-size:1.3rem;cursor:pointer;line-height:1}
.vbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:4px;pointer-events:none}
.vmeta{font-size:.82rem;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vch{font-weight:600}
.vfull{padding:2px 8px;font-size:.74rem}
.rev-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;font-size:.85rem}
.rev-ctl .wo{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.systally{display:flex;flex-wrap:wrap}
.systally .tag{display:inline-block;background:var(--muted);padding:2px 9px;border-radius:11px;margin:2px 5px 2px 0;font-size:.74rem}
.systally .tag.ok{color:var(--ok)}
.qr{border:1px solid var(--muted);border-left-width:4px;border-radius:9px;margin:6px 0;background:var(--card)}
.qr.right{border-left-color:var(--ok)} .qr.partial{border-left-color:var(--warn)} .qr.wrong{border-left-color:var(--danger)} .qr.saq{border-left-color:var(--primary)}
.qr-head{display:flex;gap:10px;align-items:flex-start;padding:9px 11px 7px}
.qr-mk{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:.82rem;background:var(--muted)}
.qr.right .qr-mk{background:var(--ok);color:var(--onprimary)} .qr.partial .qr-mk{background:var(--warn);color:var(--onprimary)} .qr.wrong .qr-mk{background:var(--danger);color:#fff}
.qr-stem{font-size:.9rem;line-height:1.35;flex:1}
.qr-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 11px 9px}
.qa{padding:3px 11px;font-size:.77rem;border:1px solid var(--muted);border-radius:14px;background:transparent;color:inherit;cursor:pointer}
.qa:hover{border-color:var(--primary)} .qa.on{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.qr-pane{padding:2px 11px 11px}
.qr .src{font-size:.72rem;color:var(--primary);margin-right:auto;opacity:.85}
.qr .you{font-size:.8rem;padding:2px 11px 4px;opacity:.85}
.qr .steps{padding:2px 11px 6px}
.score-hero{font-size:2.2rem;font-weight:800;text-align:center;margin:.3rem 0 0}
.score-sub{text-align:center;color:var(--muted-fg);margin:0 0 10px}
/* chart */
.spark{width:100%;height:84px;display:block}
.hist{font-size:.82rem;color:var(--muted-fg)}
.hist td{padding:2px 8px 2px 0}
/* chain warmup */
.chain{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.bead{background:var(--accent);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.9rem}
.bead.blank{border-style:dashed;color:var(--warn);text-align:center}
.verb{color:var(--muted-fg);font-size:.78rem;padding:0 12px}
.note{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;
  padding:8px 10px;font-size:.84rem;color:var(--muted-fg);margin:10px 0}
.src{font-size:.75rem;color:var(--muted-fg);margin-top:6px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:var(--radius);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
h3{margin:14px 0 4px;font-size:.95rem}
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--border);padding:10px 14px;display:none;gap:8px;z-index:5}
.footbar.on{display:flex}
.footbar .btn{flex:1}
a{color:var(--primary)}
</style>
</head>

sys":"senses","pts":4,"q":"Discuss how hearing occurs in humans","imgs":[],"qh":"<p>Discuss how hearing occurs in humans</p>","qt":"Discuss how hearing occurs in humans","type":"essay","saq":{"steps":["In the outer ear, sound waves are collected onto the tympanic membrane","The inner ear acts to amplify the sound waves onto the much smaller oval window","Cochlea - the oval window vibrates, moving the perilymph.","This causes the basilar membrane to move up and down and the hair cells in the scala media are stimulated to produce electrical signals when they hit the tectorial membrane.","The electrical signal travels to the auditory cortex via the vestibulocochlear (auditory) nerve"],"src":"HER own model answer, word for word · from the feedback on her quiz"}},{"id":"q2fcdaa9e49","quiz":"211104","sys":"senses","pts":1.5,"q":"What is the difference between sensorineural and conduction deafness? Which does noise-induce hearing loss fit into?","imgs":[],"qh":"<p>What is the difference between sensorineural and conduction deafness? Which does noise-induce hearing loss fit into?</p>","qt":"What is the difference between sensorineural and conduction deafness? Which does noise-induce hearing loss fit into?","type":"essay","saq":{"steps":["Conduction deafness affects the outer or middle ears and prevents sound waves from getting to the cochlea.","It is sometimes reversible.","Sensorineural deafness affect the inner ear, nerve of brain, and the electrical signals cannot be generated or sent to the brain or processed by the brain.","Sensorineural deafness is often irreversible.","Depending on where the issue is, a cochlea implant can help give a person hearing.","Noise induced hearing loss occurs do the damage to the hair cells of the organ of Corti, and mean they cannot generate the electrical signal to be sent to the brain.","This makes it a sensorineural deafness."],"src":"HER own model answer, word for word · from the feedback on her quiz"}},{"id":"q69016c771a","quiz":"211104","sys":"mixed","pts":1.5,"q":"What is the different between the static and dynamic equilibrium? How are they detected?","imgs":[],"qh":"<p>What is the different between the static and dynamic equilibrium? How are they detected?</p>","qt":"What is the different between the static and dynamic equilibrium? How are they detected?","type":"essay","saq":{"steps":["Static equilibrium — Dynamic equilibrium","Detected by the maculae of the vestibule, involves movement of the head forwards/backwards/sideways. — Detected by the ampulla cristae of the semi circular canal, involves rotational movement of the head.","Just like in the ear, movement of fluid helps to stimulate hair cells which generate electrical signals that get sent to the brain.","Sometimes there electrical signals can happen spontaneously, when there is no stimulus.","Vertigo is an example of this, someone feels like that a spinning/falling even when they are not."],"src":"HER own model answer, word for word · from the feedback on her quiz"}},{"id":"qdc9d8de3fc","quiz":"211104","sys":"senses","pts":1.5,"q":"Explain what the different parts of a wave are - amplitude, wave length and frequency.","imgs":["HS2DATA-a2052533b335aa00.jpg"],"qh":"<p>Explain what the different parts of a wave are - amplitude, wave length and frequency.</p>","qt":"Explain what the different parts of a wave are - amplitude, wave length and frequency.","type":"essay","saq":{"steps":["Amplitude - this is how tall a wave is.","This is interpreted as loudness in sound waves, and brightness is light waves.","Wave length - this is how long the wave is from the top of one wave, to the top of the next wave.","Light waves are measured in nm.","Different wave lengths of light are different colours within the visible spectrum.","There are wave outside of the visible spectrum that we cannot see too.","Frequency - is related to wavelength.","The shorter the wave length, the more waves you'll see over a given period of time.","Frequency is interpreted in sound be different pitches."],"src":"HER own model answer, word for word · from the feedback on her quiz"}},{"id":"qfe58e60567","quiz":"211104","sys":"senses","pts":2,"q":"What is the difference between refraction and reflection when it comes to light?","imgs":[],"qh":"<p>What is the difference between refraction and reflection when it comes to light?</p>","qt":"What is the difference between refraction and reflection when it comes to light?","type":"essay","saq":{"steps":["Reflection is when light hits a surface and throws light backwards - a mirror is an example of reflection.","Refraction is when light bends as it moves through mediums of different densities - a rainbow is an example of this, as ight bends (and the colours of light separate) as it travels from the air through raindrops."],"src":"HER own model answer, word for word · from the feedback on her quiz"}},{"id":"q5f1de75cd5","quiz":"211104","sys":"gen","pts":16,"q":"Find the terms by matching them to the correct definition","imgs":[],"qh":"<p>Find the terms by matching them to the correct definition</p>","qt":"Find the terms by matching them to the correct definition","type":"match","pairs":[{"left":"homozygous","right":"when the alleles of the genotype are the same"},{"left":"heterozygous","right":"when the alleles of the genotype are different"},{"left":"allele","right":"the different versions of a gene (i.g. diseased gene vs non-diseased gene)"},{"left":"dominant","right":"Will always appear in the phenotype"},{"left":"recessive","right":"Will only appear in the phenotype if no other alleles are present"},{"left":"genotype","right":"The alleles that have been inherited by an individual"},{"left":"phenotype","right":"How the traits are expressed and physically seen in the person"},{"left":"autosomal","right":"when a disease gene is found on chromosomes 1-22"},{"left":"x-linked","right":"when a disease is found on the x chromosome and generally is found in greater numbers in males"},{"left":"locus","right":"where a gene is located on a chromosome"},{"left":"chromosomes","right":"a length of DNA that has a collection of genes on it. They are found in pairs"},{"left":"genome","right":"All the DNA found within the nucleus"},{"left":"autosome","right":"A chromosome numbered 1-22"},{"left":"sex chromosome","right":"the X or Y chromosome"},{"left":"variation","right":"differences in the genes that are found in populations"},{"left":"inheritance","right":"how genes are passed from parents to children"}]},{"id":"q7baff97fb9","quiz":"211104","sys":"gen","pts":2.5,"q":"Look at the following pedigree chart What is the mode of inheritance? How can you tell? What are the genotypes of the parents at the top of the chart? What is the chance of those parents having another child with the disease if they had another child?","imgs":["HS2DATA-72f76aea0493bb6b.jpg"],"qh":"<p>Look at the following pedigree chart</p> <p>[[IMG:HS2DATA-72f76aea0493bb6b.jpg]]</p> <ol><li>What is the mode of inheritance?</li> <li>How can you tell?</li> <li>What are the genotypes of the parents at the top of the chart?</li> <li>What is the chance of those parents having another child with the disease if they had another child?</li></ol>","qt":"Look at the following pedigree chart What is the mode of inheritance? How can you tell? What are the genotypes of the parents at the top of the chart? What is the chance of those parents having another child with the disease if they had another child?","type":"essay","saq":{"steps":["What is the mode of inheritance?","This is an autosomal dominant disease.","How can you tell?","We know it is dominant as we see it present in each generation and we don't see it skipping generations.","We know it's likely autosomal as we see it in both sexes relatively equally, and we also see that a father with the disease has passed it onto his son.","What are the genotypes of the parents at the top of the chart?","The Dad must be Bb, as he has the disease, but some of his children do not, so he must be able to pass a recessive, non diseased allele to those children.","The mum does not have the disease, and so she must be a homozygous recessive bb","What is the chance of those parents having another child with the disease if they had another child?","We can do a punnet square","B b","b Bb bb","b Bb bb","which shows that if they have another child, there is a 50% chance they would inherit the disease from their dad."],"src":"HER own model answer, word for word · from the feedback on her quiz"}},{"id":"q4b8dbd9a69","quiz":"211104","sys":"gen","pts":5,"q":"What is... Polygenic inheritance? Mitochondrial inheritance? Gene therapy? Genetic engineering? Genetic testing?","imgs":[],"qh":"<p>What is...</p> <p>Polygenic inheritance?</p> <p>Mitochondrial inheritance?</p> <p>Gene therapy?</p> <p>Genetic engineering?</p> <p>Genetic testing?</p>","qt":"What is... Polygenic inheritance? Mitochondrial inheritance? Gene therapy? Genetic engineering? Genetic testing?","type":"essay","saq":{"steps":["Polygenic inheritance?","When many genes contribute to a trait - like height, and skin colour - which results in 'continuous phenotypic variation'.","So for example, height exists on a bell curve - we don't just have short and tall people, we have a huge range!","Mitochondrial inheritance?","Mitochondrial DNA can only be passed from MOTHER to CHILD (both sons and daughters!)","Gene therapy?","Is the idea that we can use vectors to insert DNA into humans that could cure diseases","Genetic engineering?","This is when we use SCIENCE to change the DNA of an organism","Genetic testing?","Using different techniques, we can get the DNA sequence of a organism - this includes the DNA of human genes to tell us when genes we have and what that might mean for us.","For example, some people have certain genes which might cause a disease, and we can find this out by using a blood test and these genetic testing methods."],"src":"HER own model answer, word for word · from the  expression of genes is called the ____\" with the term as the answer, the same dozen terms re-asked across eight quizzes, plus three big matching tables of term ↔ definition.","cap":"Definitions only. She never asks you to explain one of these terms in a paragraph.","all":32,"n":23,"pts":56.5,"qz":8,"saq":1,"tier":1,"qs":["q6cf9348547","qe9eed424dd","q9deb5d5859","qea917095fe","q4b4f7d8dcd","q6ad2f40908","qd9374d05b7","q5008bdb92f","q2605b99ab0","q6fdce2e020","qc7982103b6","q612c8eeb07","q1a59fe90c9","q90a588652e","q64e2b9b412","qd0429b2dc3","q84affb9b19","qa896f411b4","q4ed1f9ea01","qba10b6d6bd","q5f1de75cd5","q0f58f154ae","qc1adb0e47d"]},{"id":"gen-blood","sys":"gen","crit":"Genetics 5","t":"ABO blood groups — multiple alleles","rev":"deck · slide 9","done":"Know the six genotypes and four blood types, that A and B are codominant and both dominant over O, and run an ABO cross (AO × BO gives all four types; an O child needs an O allele from each parent).","ask":"Scenario MCQs (\"a man with type AB marries…\") and two matching tables of cross → offspring genotypes.","cap":"ABO only. Rhesus is not asked anywhere in her bank.","all":17,"n":14,"pts":18,"qz":8,"saq":0,"tier":2,"qs":["q9f39b81e29","q5be8e5e83c","qe00a75a0dd","qb73b19d8f7","qb15b89766b","q9ba03f1668","qef9e4c0501","q3c3d45b834","q29c60f9262","q5cc7fa0397","qc485e78535","qe17bbdf64c","q238c08a0e2","q545c6fe2ca"]},{"id":"gen-patterns","sys":"gen","crit":"Genetics 5","t":"Codominance, incomplete dominance, polygenic inheritance","rev":"deck · slide 9","done":"Tell the three apart with an example each: incomplete dominance = a blend (red × white → pink; curly × straight → wavy; her sickle-cell question), codominance = both show (AB blood), polygenic = many gene pairs → a continuous range (skin colour, height).","ask":"\"The form of inheritance in which the heterozygous state is expressed as an intermediate is ____\", asked twice over; her skin-colour distribution figure as a drop-down.","cap":"Naming and recognising the pattern. No crosses are asked for incomplete dominance beyond the curly-hair problem.","all":13,"n":10,"pts":18.5,"qz":8,"saq":1,"tier":2,"qs":["qf65ae2fac5","q83774a08af","qa856d1dfb1","q3d599182dd","qc1cacc0e96","qe8927d090d","q7abb1f137e","q8cec5ef335","q0998b434b2","q4704a9f8be"]},{"id":"gen-karyotype","sys":"gen","crit":"Genetics 2","t":"Karyotypes and chromosome-number disorders","rev":"deck · slide 13","done":"Read a karyotype: 22 pairs of autosomes + one pair of sex chromosomes = 46; XX or XY; spot the extra or missing one — trisomy 21 (Down, 47), XO (Turner, 45), XXY (Klinefelter, 47). Say what aneuploidy is and that non-disjunction causes it.","ask":"A karyotype picture with \"what disorder is present?\" / \"male or female?\"; definition one-liners; her own written question \"How many chromosomes are in a human karyotype? What is aneuploidy?\".","cap":"Those three disorders and no others. Several karyotype pictures did not load when the pages were saved — held until re-saved.","all":20,"n":18,"pts":20,"qz":10,"saq":1,"tier":2,"qs":["qae529e1859","q401c31d7ff","qe25e0246c7","q12f99a3c82","q12bdcd5e06","q621752f3c6","qaaea1201b7","q66e4a791e7","q6bd9cd72e5","q230f77f225","qfdc7ccad3a","qe26d5354ee","qb9a5523de4","q48b925adfd","qff024e3555","q3b0e0ce30a","q38eff182ac","qa9ce93bc54"]},{"id":"gen-sexlinked","sys":"gen","crit":"Genetics 4","t":"Sex-linked (X-linked) inheritance","rev":"deck · slide 10","done":"Explain why males show X-linked recessive conditions more often (one X, no matching allele on the Y), why only females can be carriers, and that a male who inherits the colour-blindness allele always expresses it.","ask":"One-mark completions and a two-blank drop-down (\"Males cannot be carriers because they only carry one X allele\"). Queen Victoria's haemophilia pedigree is on the pedigree row.","cap":"Colour blindness and haemophilia are her only examples.","all":8,"n":6,"pts":7,"qz":5,"saq":1,"tier":3,"qs":["qac1bd2875a","q0124a5bf9d","q969c3c85cc","qdef0234521","qf931ce3a53","qb865fbb657"]},{"id":"gen-mito","sys":"gen","crit":"Genetics 5","t":"Mitochondrial inheritance","rev":"deck · slide 9","done":"Mitochondrial DNA is part of the genome but not of the nuclear DNA, and it passes from the mother to all her children — never from the father.","ask":"True/false and one-mark MCQs.","cap":"Two facts; that is all she asks.","all":5,"n":4,"pts":3,"qz":4,"saq":0,"tier":3,"qs":["q4ce811b8aa","q5ba6686fdc","qb04b058b55","q6888b5cc41"]},{"id":"gen-dna","sys":"gen","crit":"Genetics 3","t":"DNA, chromosomes and meiosis","rev":"deck · slide 8","done":"DNA → coiled into a chromosome; a gamete has 23 chromosomes and a zygote 46, half from each parent; crossing over (chiasmata) separates linked genes in meiosis.","ask":"A handful of one-mark MCQs and one matching table (DNA, chromosome, gene…).","cap":"Her criteria call it \"review from BN1\". No DNA replication, transcription or translation anywhere in her Module 3 bank.","all":9,"n":6,"pts":12.5,"qz":5,"saq":0,"tier":2,"qs":["q8f85ef1e69","qab0f669884","qae7b389e18","q7b3f94fc84","q49c8b13a65","q316970d173"]},{"id":"gen-disorders","sys":"gen","crit":"Genetics 2","t":"Mutations and single-gene disorders","rev":"deck · slide 14","done":"A mutation is a permanent change in the structure of a gene. Know Tay-Sachs as her recessive example, and that schizophrenia and Down syndrome are NOT simple recessive traits.","ask":"One-mark questions. The disease names mostly turn up as costumes on Punnett-square problems (that row).","cap":"Thin in her bank — see the count on this row.","all":3,"n":2,"pts":2,"qz":3,"saq":0,"tier":3,"qs":["q85b8920116","qf6e3eb32d3"]},{"id":"gen-therapy","sys":"gen","crit":"Genetics 9","t":"Gene therapy and genetic engineering","done":"Gene therapy = treatment that corrects a single-gene disorder. Be able to write a line each on polygenic inheritance, mitochondrial inheritance, gene therapy and genetic engineering — she asks all four in one written question, and her own answer ships with it.","ask":"One MCQ asked twice, and one 5-mark written question.","cap":"Definitions, one line each.","all":3,"n":2,"pts":6,"qz":3,"saq":1,"tier":3,"qs":["q501dac3a96","q4b8dbd9a69"]},{"id":"gen-testing","sys":"gen","crit":"Genetics 8","t":"Fetal and genetic testing","done":"The most common form of fetal testing is amniocentesis.","ask":"That one MCQ, asked in two quizzes.","cap":"Her criterion says \"explain some ways genetic abnormalities are detected\"; her bank asks one fact.","all":2,"n":1,"pts":1,"qz":2,"saq":0,"tier":3,"qs":["qe1ad6e4bde"]},{"id":"eye-anatomy","sys":"senses","crit":"Special senses 1","t":"Structures of the eye and what each does","rev":"deck · slides 15–16","done":"Label an eye in section (hers comes both ways round — cornea on the left on her slide, on the right in her quizzes) and give each part's job: cornea 80 % of refraction, lens 20 %, the three layers (fibrous · vascular · neural) and what is in each, the two humours, fovea = only cones, optic disc = no rods or cones, hyaloid canal, ciliary muscle.","ask":"Number-the-parts and letter-the-parts figures, a 20-mark matching table of description ↔ part, and her own written question \"What are the three layers of the eye, their structures and functions\" (her table ships as the answer).","cap":"Recognition plus one-line functions. The eyelid and tear questions (palpebrae, lacrimation) are one mark each.","all":11,"n":11,"pts":53.5,"qz":5,"saq":3,"tier":1,"qs":["qad2e3f869b","q2f1c747402","q32c8061bfe","q451804337d","q6a05f9e747","qd693d93fdb","qfa89af9f25","qa5e93ced16","qfa2f650482","q82d491b4c0","q3da24a1a85"]},{"id":"eye-focus","sys":"senses","crit":"Special senses 2","t":"Accommodation, the pupil and image formation","rev":"deck · slides 16–17","done":"Near vision: ciliary muscle CONTRACTS → suspensory ligaments slacken → lens bulges; the eyes converge and the pupil constricts. Far vision is the reverse. Pupil: sympathetic → radial muscles → dilates; parasympathetic → circular muscles → constricts. The image on the retina is real and inverted; the brain turns it upright; half the fibres cross at the optic chiasma.","ask":"True/false with the mechanism reversed (\"the ciliary muscle contracts to flatten the lens for near vision\" — false), two drop-down paragraphs comparing close-up and far vision, and her written \"What changes occur in the eye to allow near vision?\".","cap":"The chain as far as the lens changing shape. No diopters, no calculations.","all":10,"n":10,"pts":17,"qz":7,"saq":4,"tier":2,"qs":["q63aa95840e","qc8ba234298","q51df73f097","q6b1cc8b609","q8b5da9df8c","q8eaf1e1b17","qcddf12d7d8","q899a32a6d3","qc1d62ad717","qb38324f8e1"]},{"id":"eye-retina","sys":"senses","crit":"Special senses 2","t":"The retina: rods, cones and colour blindness","rev":"deck · slide 15","done":"Rods = dim light, no colour; cones = bright light and colour, concentrated at the macula and alone at the fovea (sharpest vision); visual pigments differ by their opsin; colour blindness = the CONES are affected; an afterimage = photoreceptors still firing after the light has gone.","ask":"One-mark MCQs (\"focusing on the ____ gives the highest visual acuity\"), a 12-mark drop-down table of receptor · location for light AND sound, and short written questions with her own answers.","cap":"The inheritance of colour blindness is on the sex-linked row; this row is only the receptors.","all":9,"n":9,"pts":19.5,"qz":5,"saq":3,"tier":2,"qs":["q1e7407ca1a","q7f09ec977d","q32497a6125","q73f30c2a67","q08b9b14be5","q0be8a2f6bb","qc0e1379b6f","qdc2e6bc65f","q9cb10bfb12"]},{"id":"eye-errors","sys":"senses","crit":"Special senses 3","t":"Myopia, hyperopia, astigmatism — and the lens that fixes each","done":"Myopia: eyeball too long or lens too strong → image falls in FRONT of the retina → concave (diverging) lens. Hyperopia: too short or too weak → behind the retina → convex (converging) lens. Emmetropia = normal. Astigmatism = irregular cornea or lens → several focal points.","ask":"Two matching tables (condition ↔ description, condition ↔ corrective measure) and four written questions with her own answers, including \"Explain how myopia, emmetropia and hyperopia are different\" for 3 marks.","cap":"Four written questions on six items — this is where she makes you write. Presbyopia appears only inside a matching table.","all":6,"n":6,"pts":26,"qz":3,"saq":4,"tier":2,"qs":["qf2ae6a15b7","qa7eed3ac3b","qd2b4ee049e","q8563c60a07","q892a8aa5f6","q99146d1381"]},{"id":"eye-imbalances","sys":"senses","crit":"Special senses 4","t":"Glaucoma, cataracts and pinkeye","done":"Glaucoma = aqueous humour does not drain → intraocular pressure rises → damages the optic nerve. Cataract = the lens goes cloudy (its proteins denature). Pinkeye = infection of the conjunctiva. Diabetes can cause all of cataracts, glaucoma and retinopathy.","ask":"Definition MCQs, one true/false, and her written \"Briefly explain what glaucoma and cataracts are\" (2 marks).","cap":"Definitions and the one causal line each.","all":7,"n":7,"pts":12.5,"qz":4,"saq":1,"tier":2,"qs":["qf86cc4319d","qb84fd1c83b","q96e56f9fc9","qcfd00b5c75","q1f1ee07c2b","q83cd61d2d7","qe56fcff863"]},{"id":"ear-anatomy","sys":"senses","crit":"Special senses 5","t":"The three regions of the ear","rev":"deck · slides 18–20","done":"Outer (pinna, canal, eardrum) · middle (malleus → incus → stapes, Eustachian tube) · inner (cochlea, vestibule, semicircular canals), with one function each: the ossicles AMPLIFY and the stapes pushes on the oval window; air in the outer ear, bone in the middle, fluid in the inner; the hearing receptors are in the inner ear.","ask":"A 10-mark matching table of description ↔ part, one-mark MCQs asked twice over, and her written \"What are the three regions of the ear, describe their structures and functions\" (her table ships as the answer).","cap":"Parts and one-line jobs.","all":11,"n":9,"pts":23.5,"qz":6,"saq":1,"tier":2,"qs":["qe3e204b22c","qfc4b49cdbd","q6d5c5dc5b6","q98b5af4f4f","qc8036cfc29","q973fff7c2a","qecf2bf30a0","q1b3811c4ef","q5524bb4292"]},{"id":"ear-hearing","sys":"senses","crit":"Special senses 6","t":"How hearing works — the pathway and transduction","rev":"deck · slide 21","done":"Put it in order: canal → eardrum → ossicles → oval window → perilymph of the scala vestibuli and tympani → basilar membrane → hair cells bend against the tectorial membrane → neurotransmitter → cochlear nerve. Different parts of the basilar membrane answer different frequencies. Mechanical → electrical = transduction, by the hair cells of the organ of Corti in the scala media.","ask":"Two arrange-in-order questions, a nine-blank drop-down paragraph of the whole pathway, \"what are the receptors for sound and where exactly are they found?\", and her 4-mark written \"Discuss how hearing occurs in humans\".","cap":"The sequence. No question asks for the ion channels or the membrane potentials of the hair cell.","all":11,"n":10,"pts":28,"qz":6,"saq":2,"tier":2,"qs":["qebf8655203","qee4a03bd0e","q5b85c3c6ad","qd2b05caee2","qeeaa5d0758","q8518bd474e","qfd18803c7d","qb3f06bf5b7","qfbcf45ca29","q55c7b97606"]},{"id":"ear-deafness","sys":"senses","crit":"Special senses 7","t":"Conduction versus sensorineural deafness","rev":"deck · slide 22","done":"Conduction deafness = sound cannot get THROUGH (wax from the ceruminous glands, perforated eardrum, stiff ossicles). Sensorineural = hair cells or nerve damaged — noise-induced hearing loss and ototoxic drugs (gentamicin, some TB drugs) belong here. Loud sound can be FELT because it is vibration picked up by mechanoreceptors.","ask":"\"The following is NOT a cause of conductive hearing loss\", true/false on ototoxic drugs, the sound-shirt MCQ, and her written \"What is the difference between sensorineural and conduction deafness? Which does noise-induced hearing loss belong to?\".","cap":"Sorting a cause into one of the two bins.","all":7,"n":6,"pts":6,"qz":6,"saq":2,"tier":3,"qs":["q3ab56ce02a","qf352191541","qc2c3c569f9","qd8069871c2","q2fcdaa9e49","q534e4c99e4"]},{"id":"ear-balance","sys":"senses","crit":"Special senses 8 · 9","t":"Static and dynamic equilibrium","rev":"deck · slide 20","done":"Static equilibrium = head position and straight-line movement, from the utricle and saccule; dynamic = rotation, from the semicircular canals. Both work by mechanoreception (bending hair cells). The MIDDLE ear has nothing to do with balance.","ask":"One MCQ and her 1.5-mark written \"What is the difference between static and dynamic equilibrium? How are they detected?\".","cap":"Two criteria, two questions in her whole bank.","all":2,"n":2,"pts":2.5,"qz":2,"saq":1,"tier":3,"qs":["qbf54ead961","q69016c771a"]},{"id":"phys-waves","sys":"senses","crit":"Special senses 10","t":"Waves: amplitude, wavelength, frequency — and how we experience them","done":"Frequency → pitch (sound) or colour (light); amplitude → loudness or brightness; wavelength is the distance between crests. Sound needs a medium (no sound in a vacuum). The Doppler effect = the apparent change in frequency as the source moves relative to you.","ask":"A nine-blank drop-down table (what is it / what does it mean for sound / for light), two 10-mark \"comparing light and sound\" matching tables, Doppler MCQs, and her written \"Explain the different parts of a wave\".","cap":"Concepts only — no calculations of speed, frequency or decibels anywhere in her bank.","all":11,"n":10,"pts":36,"qz":7,"saq":3,"tier":1,"qs":["q62ca64d857","q519cd3010e","q8bededec4c","q828fc6b52f","qeb9a447db7","qd2bc4e0cb5","q269f7910cb","q41a12e1f9c","qdc9d8de3fc","qe0e0a2fdb7"]},{"id":"phys-bend","sys":"senses","crit":"Special senses 11","t":"Refraction and reflection, of light and of sound","done":"Refraction = a wave BENDS as it enters a medium of different density; reflection = it BOUNCES back. Examples she uses: rainbows (white light is many wavelengths, each refracted differently by raindrops), echoes and sonar (reflected sound), sound bending upward away from heated ground (refracted sound).","ask":"True/false, \"choose the two correct answers\", a three-blank drop-down definition, and two written questions with her own answers (\"Why do rainbows form?\", \"What is the difference between refraction and reflection when it comes to light?\").","cap":"Definitions with her examples.","all":13,"n":11,"pts":13.5,"qz":7,"saq":3,"tier":2,"qs":["q555a14ddf8","q6f2eb50185","q2ddf9e0576","qb5d47187a7","qd992242132","q54556c18ab","qc94d5cff46","q1a51992224","q0b53507b0c","qfe58e60567","qd96e135cf4"]},{"id":"taste","sys":"senses","crit":"Special senses 12","t":"Taste","done":"Taste is about 80 % smell — which is why food tastes flat with a blocked nose.","ask":"One MCQ in the whole bank.","cap":"Her criterion says \"briefly describe the structure of the taste buds\"; her quizzes never ask it.","all":1,"n":1,"pts":1,"qz":1,"saq":0,"tier":3,"qs":["q3d34914c54"]},{"id":"smell","sys":"senses","crit":"Special senses 13","t":"Smell (olfaction)","done":"Know that the olfactory epithelium in the roof of the nasal cavity holds the receptors.","ask":"Not asked: none of her 23 quizzes has a question on it.","cap":"On her criteria list, absent from her bank. Read it once.","all":0,"n":0,"pts":0,"qz":0,"saq":0,"tier":3},{"id":"repro-male","sys":"repro","crit":"Reproductive 1 · 2","t":"Male organs, ducts and the path the sperm take","rev":"deck · slides 5–6","done":"Label the male system (her figure is a side-on section, front of the body on the left) and give the path: testis → epididymis (where sperm mature) → vas deferens → ampulla → ejaculatory duct → urethra. Scrotum keeps the testes about 3 °C cooler; cremaster (skeletal) pulls them up in the cold, dartos (smooth) wrinkles the skin.","ask":"Definition MCQs (\"the duct that takes sperm from the testes to the ejaculatory duct\"), a six-blank pathway sentence, \"which statement about the dartos muscle is FALSE\", and two big written questions: label all the structures of both systems (10 marks) and tabulate the differences between them (6).","cap":"Recognition and order. Her label figure for the vasectomy site did not load when the page was saved — held.","all":18,"n":18,"pts":37,"qz":4,"saq":3,"tier":1,"qs":["q724e90ecf5","q3b8e6a6cf6","q7108ad86e8","q49788fd4dd","q51a885ff41","qe2ee2fd35c","q5ae0bc85ae","qf2fc819f35","q5f8865b8f4","q0f48d31135","q55d365a89c","q090f14f81b","q7952391084","q6b3a8ed1ef","q6cd0504c7f","qc81960d3b7","q030e2b0d2d","qca3e0c0c0f"]},{"id":"repro-sperm","sys":"repro","crit":"Reproductive 3","t":"Spermatogenesis and its hormonal control","rev":"deck · slides 5, 7","done":"Spermatogonium (diploid, mitosis — which is why males make gametes for life) → primary spermatocyte → meiosis I → secondary spermatocyte → meiosis II → spermatids → spermiogenesis → sperm. FSH → Sertoli cells (nurture sperm, make INHIBIN, which suppresses FSH); LH → Leydig cells → testosterone. Sperm: acrosome, 23 chromosomes as chromatin in the head, mitochondria in the midpiece for ATP, tail to propel.","ask":"An 8-pair matching table of the cell stages, her six-blank sperm table, \"the pituitary hormone that stimulates ____ is ____\" asked four ways, and her 4-mark written question on gamete production and its hormones.","cap":"The sequence and which hormone acts on which cell. Her label-the-sperm figure did not load — held.","all":17,"n":17,"pts":35,"qz":5,"saq":3,"tier":1,"qs":["q11663a40ed","qccdc39b55d","q58122e2408","q0dd7704174","q865e72d0c2","q3fe52c38e6","q95cc0e912e","q463cb2e7bc","q70fa096ecb","q18cf26e08b","q30039ceeaf","q20a4aeeaee","q14e878c37b","q3401e33d38","q997d4f4436","qe233766bcf","q896b441451"]},{"id":"repro-semen","sys":"repro","crit":"Reproductive 6","t":"What is in semen, and which gland adds it","rev":"deck · slide 5","done":"Seminal vesicles: about 60 %, alkaline, fructose, prostaglandins (which make the uterus contract in reverse peristalsis). Prostate: about 30 %, citric /* ── dealing ───────────────────────────────────────────────────────── */
const CLOSED = DATA.questions.filter(q=>!q.saq);
function pickN(pool, n, excl){
  const fresh = pool.filter(q=>!excl.has(q.id));
  /* Least-seen first: rank = times dealt, so nothing repeats an (n+1)th time
     until the whole pool has been dealt n times. Misses jump the queue (-2),
     Math.random() only breaks ties among equally-seen questions. */
  const rank = q => (S.miss[q.id]?-2:0) + (S.seen[q.id]||0) + Math.random();
  return fresh.sort((a,b)=>rank(a)-rank(b)).slice(0,n);
}
function dealStratified(n){
  const out=[], excl=new Set();
  /* shares are DERIVED from the bank — her revealed question distribution —
     never typed. Announced emphasis does not get a vote. */
  const share = {};
  for(const q of CLOSED) share[q.sys]=(share[q.sys]||0)+1/CLOSED.length;
  for(const sys of ['repro','gen','senses','mixed']){
    const want=Math.round(n*(share[sys]||0));
    for(const q of pickN(CLOSED.filter(x=>x.sys===sys), want, excl)){ out.push(q); excl.add(q.id); }
  }
  while(out.length<n){
    const q=pickN(CLOSED, 1, excl)[0]; if(!q)break; out.push(q); excl.add(q.id);
  }
  return shuffle(out).slice(0,n);
}
/* How many a Learn deal hands out is HIS call (the chips on the Learn door), saved in this
   browser. 'all' is the whole pool, least-seen first — so a run that stops halfway and is
   dealt again leads with the questions it never reached. A mock test keeps its own size. */
const NOPTS = [12,25,50,100,'all'];
const CAP = () => S.n==='all' ? Infinity : S.n;
const howMany = pool => Math.min(CAP(), pool);
function dealMini(n=12){ return dealStratified(n) }
function dealSys(s,n){ return shuffle(pickN(CLOSED.filter(q=>q.sys===s), n, new Set())) }
function dealFull(){
  const closed = dealStratified(40);
  const essays = shuffle(DATA.questions.filter(q=>q.saq));
  const saqs = [];
  if(DATA.case7){ saqs.push(mkCaseQ(DATA.case7.questions[(S.scores.filter(s=>s.mode==='full').length) % DATA.case7.questions.length])); if(essays[0]) saqs.push(essays[0]); }
  else saqs.push(...essays.slice(0,2));      /* no case study wired for this module yet: two of her essays, each marked against HER own answer */
  return closed.concat(saqs);
}
function mkCaseQ(cq){
  return { id:'c7-'+cq.q.slice(0,24).replace(/\W/g,''), quiz:'case7', sys:'mixed', type:'essay',
    pts:cq.marks, q:cq.q, imgs:[], saq:{steps:cq.steps, src:'Case study 7 — model answer is the tool’s'},
    scenario: DATA.case7.scenario };
}
/* the misses pile, worst first: once four or more have been missed twice, only those */
function missPool(){
  let ids = Object.keys(S.miss).filter(id=>S.miss[id]>=2);
  if(ids.length<4) ids = Object.keys(S.miss);
  return CLOSED.filter(q=>ids.includes(q.id));
}
function dealMisses(n=12){ return shuffle(missPool()).slice(0,n) }
/* the ticked quizzes, whole (written questions included), in the order the list shows
   them — one run, no cap: you chose the quizzes, you get their questions */
function dealPick(){

let SIT=null;
/* `learn` sits the same deck in Learn mode: marked per question, resources in place,
   never timed, never on the score chart (see the learn-mode block below) */
/* a Learn run is saved as it goes (deck ids + every mark), so a phone that drops the tab
   halfway through 200 questions loses nothing: home offers to pick it up. A mock is one go. */
function saveRun(){
  if(!SIT||!SIT.learn)return;
  SV('resume',{ids:SIT.deck.map(q=>q.id),i:SIT.i,ans:SIT.ans,chk:SIT.chk,peek:SIT.peek,label:SIT.label,mode:SIT.mode,t0:SIT.t0});
}
function resumeLearn(){
  const r=LS('resume');
  const byId=new Map(DATA.questions.map(q=>[q.id,q]));
  const deck=r&&Array.isArray(r.ids)?r.ids.map(id=>byId.get(id)).filter(Boolean):[];
  if(!deck.length){SV('resume',null);home();return}
  SIT={deck,label:r.label||'picked up',mode:r.mode||'mini',i:Math.min(Math.max(r.i|0,0),deck.length-1),ans:r.ans||{},t0:r.t0||Date.now(),timed:false,end:null,learn:true,chk:r.chk||{},peek:r.peek||{}};
  renderQ();window.scrollTo(0,0);
}
function start(mode,learn=false){
  let deck,label,timed=false;
  if(learn){const r=LS('resume');
    if(r&&r.ids&&r.ids.length&&!confirm(`You have a Learn run waiting (Q${Math.min((r.i|0)+1,r.ids.length)} of ${r.ids.length} · ${r.label}). Drop it and start this one?`))return}
  if(mode==='mini'){
    if(learn){deck=dealMini(howMany(CLOSED.length));label=deck.length===CLOSED.length?'the whole bank':`${deck.length} from the bank`}
    else{deck=dealMini();label='mini mock'}}
  else if(mode==='full'){deck=dealFull();label='full mock';timed=true}
  else if(mode==='miss'){deck=dealMisses(learn?CAP():12);label=learn?'my misses':'redo misses'}
  else if(mode==='pick'){deck=dealPick();const k=S.pick.length;
    label=k===1?(DATA.quizzes.find(z=>z.id===S.pick[0])||{}).name||'1 quiz':`${k} quizzes · ${deck.length} Q`}
  else if(mode.startsWith('quiz:')){const z=DATA.quizzes.find(x=>x.id===mode.slice(5));
    deck=DATA.questions.filter(q=>q.quiz===z.id);label=z.name}
  else if(mode.startsWith('topic:')){const f=DATA.focus.find(x=>x.id===mode.slice(6));
    /* a focus row's own questions (content/qrow.js, read by hand), in the row's order */
    const byId=new Map(DATA.questions.map(q=>[q.id,q]));
    deck=((f&&f.qs)||[]).map(id=>byId.get(id)).filter(Boolean);label=f?f.t:'topic'}
  else if(mode.startsWith('sys:')){const s=mode.slice(4), pool=CLOSED.filter(q=>q.sys===s).length;
    deck=dealSys(s,howMany(pool));label=`${deck.length===pool?'all ':''}${deck.length} ${s}`}
  if(!deck||!deck.length){alert('Nothing to deal here yet.');return}
  if(learn){timed=false;SV('resume',null)}
  SIT={deck,label,mode,i:0,ans:{},t0:Date.now(),timed,end:timed?Date.now()+65*60*1000:null,learn,chk:{},peek:{}};
  if(mode==='mini'&&DATA.chains.length){warmup();return}
  renderQ();
}
function warmup(){
  const ch=DATA.chains[Math.random()*DATA.chains.length|0];
  const beads=ch.beads.filter(b=>b.t);

  const others=shuffle(DATA.chains.filter(c=>c!==ch).flatMap(c=>c.beads.filter(b=>b.t).map(b=>b.t))).slice(0,3);

    ${opts.map(o=>`<label class="opt"><input type="radio" name="wu"><span>${esc(o)}</span></label>`).join('')}

    } else renderQ()};
  $('#wuSkip').onclick=renderQ;

let timerIv=null;
function renderQ(){

  const a=SIT.ans[q.id];
  const imgTag=f=>`<img class="qimg" src="img/${f}" alt="question figure" loading="lazy">`;

    ? `<select class="inl" data-i="${i}" aria-label="blank ${i+1}"><option value="">— choose —</option>${shuffleStable(q.id+i,b.options).map(o=>`<option ${a&&a.pick&&a.pick[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
    : `<input type="text" class="inl" data-i="${i}" style="width:${Math.min(26,Math.max(7,Math.max(...b.options.map(o=>o.length))+3))}ch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type…" aria-label="blank ${i+1}" value="${a&&a.pick?esc(a.pick[i]||''):''}">`;

          .replace(/\[\[BLANK:(\d+)\]\]/g,(m,k)=>q.type==='cloze'&&q.blanks[+k]?widget(q.blanks[+k],+k):'____')
    : esc(q.q);
  const imgs=(q.imgs||[]).filter(f=>!placed.has(f)).map(imgTag).join('');

      <input type="${multi?'checkbox':'radio'}" name="q" value="${i}" ${a&&a.sel&&a.sel.includes(i)?'checked':''}>
      <span>${esc(optLabel(q,o))}</span></label>`).join('');
    if(multi)body=`<div class="note">Tick every answer that applies — it may be just one.</div>`+body;
  } else if(q.type==='match'){
    const bank=shuffleStable(q.id,[...new Set(q.pairs.map(p=>p.right))]); // a right-hand item used twice is still ONE option
    body=q.pairs.map((p,i)=>`<div class="blankrow"><label>${esc(p.left)}</label>

      ? `<div class="note">${q.bk==='dd'?'Pick from each dropdown in the text.':'Type into each blank in the text — spelling counts, capitals don’t.'}</div>`
      : q.blanks.map((b,i)=>`<div class="blankrow"><label>${esc(blankLabel(b,i))}${q.bk==='dd'?'':' (type it)'}</label>${widget(b,i)}</div>`).join('');

    t.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`;t.classList.toggle('low',s<300);

function shuffleStable(seed,arr){
  let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;
  return arr.map((v,i)=>({v,k:(h=(h*1103515245+12345)>>>0)})).sort((a,b)=>a.k-b.k).map(x=>x.v);
}
function saveAns(){
  const q=SIT.deck[SIT.i];
  if(q.type==='essay'){const t=document.querySelector('[data-essay]');if(t&&t.value.trim())SIT.ans[q.id]={text:t.value};return}
  if(q.type==='match'||q.type==='cloze'){
    const pick={};let any=false;
    document.querySelectorAll('[data-i]').forEach(el=>{if(el.value){pick[el.dataset.i]=el.value;any=true}});
    if(any)SIT.ans[q.id]={pick};return}
  const sel=[...document.querySelectorAll('.opt input:checked')].map(i=>+i.value);
  if(sel.length)SIT.ans[q.id]={sel};
}
/* ── learn mode ────────────────────────────────────────────────────────
   The same deck and the same marking, but per question: Check marks it in place and
   the answer, her slide and the matched video sit right under it — the results
   accordion brought forward to the moment you still care. Slide and video can be
   opened BEFORE answering; that counts as a peek, and a right answer after a peek
   does not clear a miss. Check with nothing picked = "show me" = a miss. Learn
   sittings feed the misses pile and the least-seen dealer, never the score chart. */
function learnChipsHTML(q){
  const chips=[];
  if(q.vid)chips.push(`<button class="qa" data-act="vid">▶ Video · from ${mmss(Number.isInteger(q.vid.at)?q.vid.at:0)}</button>`);
  for(const r of q.refs)chips.push(`<button class="qa" data-act="${r.k}">${REF[r.k].ic} ${REF[r.k].lbl}${r.k==='patton'?' p. '+r.pp:''}</button>`);
  if(hasHer(q))chips.push('<button class="qa" data-act="hl">✅ Her worked answer</button>');
  const hint=chips.length?(SIT.chk[q.id]?'':'<span class="hint">open before or after you answer</span>')
    :(DATA.questions.some(x=>x.vid||(x.refs&&x.refs.length))

function markQ(q,a){
  if(q.type==='essay')return null; // self-marked
  if(!a)return{got:0,tot:q.pts,detail:'no answer'};
  if(q.type==='mcq'||q.type==='tf'||q.type==='multi'){
    const chosen=(a.sel||[]).map(i=>q.opts[i]);
    const right=chosen.length===q.key.length&&q.key.every(k=>chosen.includes(k));
    return{got:right?q.pts:0,tot:q.pts,you:chosen.map(o=>optLabel(q,o)).join(' · ')}}
  if(q.type==='match'){
    let got=0;q.pairs.forEach((p,i)=>{if((a.pick||{})[i]===p.right)got++});
    return{got:got*q.pts/q.pairs.length,tot:q.pts,you:q.pairs.map((p,i)=>(a.pick||{})[i]||'—').join(' · ')}}
  if(q.type==='cloze'){
    let got=0;
    q.blanks.forEach((b,i)=>{if(blankOK(q,b,(a.pick||{})[i]))got++});
    return{got:got*q.pts/q.blanks.length,tot:q.pts,you:q.blanks.map((b,i)=>(a.pick||{})[i]||'—').join(' · ')}}
}
/* dropdown: only her marked option is right. Typed: every accepted spelling is. */

   without that an AI happily teaches the Krebs cycle for a test that only asks
   you to rank three energy routes. An AI's quiz checks the analogy landed; only
   her questions here check that it would earn marks. */
const AI_CTX='I’m a first-year nursing student sitting Health Science 2, Test 3 (Module 3: reproduction, genetics, special senses, light and sound).';
const AI_LBL='🤖 Explain like I’m stupid + quiz me';
const AI_SHAPE={mcq:'multiple choice',tf:'true or false',multi:'tick every answer that applies',match:'matching',cloze:'fill the blanks / dropdowns',essay:'a written answer marked one mark per step'};
/* 2026-09-19, his verdict on the first shape: “how do I learn this with no visual input, it’s quizzing me
   on shit I don’t even have a functioning anything of.” So the order is now SEE it → explain it → say it back →
   and only on “ready”, the quiz, easiest question first. `fig` = a picture went with the paste. */
const aiSteps=(extra,shape,stop,fig)=>{
  const S=[
    (fig?'SHOW me first. A picture is pasted with this message: start there and tell me exactly where to look on it. Then':'SHOW me first. Before any explanation,')+' draw it as a simple labelled sketch made of text — boxes and arrows for a process, a front / side / top layout for where things sit in the body — so I can SEE what is where, or what leads to what. If you can show or generate a real image, add ONE simple one with few labels, and check every label is right. Then give me one exact phrase to type into Google Images for a proper labelled diagram.',
    'Explain it like I’m stupid, pointing at the sketch: one everyday analogy, then map every part of the analogy back to the real term.',
    'Use my lecturer’s exact terms from above. Those words earn the marks; the analogy is scaffolding.'];
  if(extra)S.push(extra);
  S.push('Then STOP. Do NOT quiz me in the same message. Ask me to say it back in my own words, or to type “ready”. If what I say back is wrong, fix that one piece — on the sketch — before going on.',
    `Only when I say ready: a 5-question blind quiz, ONE question at a time, instant feedback after each answer, ${shape}. Start with the easiest question you can write and build up. If I miss one, re-explain that piece before the next question.`);
  return 'I am starting from ZERO on this. Build it up for me; don’t test me on it cold.\nDo this, in order:\n'+S.map((x,i)=>`${i+1}. ${x}`).join('\n')+'\n'+stop;
};
function aiQuestionPrompt(q,withFig){
  const a=SIT.ans[q.id];
  const you=a?(a.text||((a.sel||[]).map(i=>optLabel(q,q.opts[i])).join(', ')||Object.values(a.pick||{}).join(', '))):'';
  const L=[AI_CTX+' This is one of my lecturer’s own practice questions. I want to understand it, not memorise the answer.','',`Question: ${flatStem(q)}`];
  if(q.opts&&q.opts.length)L.push(`Options: ${q.opts.map(o=>optLabel(q,o)).join(' | ')}`);
  if(q.saq)L.push('Her model answer, one mark per step: '+q.saq.steps.map((s,i)=>`(${i+1}) ${s}`).join(' '));
  else L.push(`Correct answer: ${keyText(q)}`);
  L.push(`My answer: ${you||'(none — I didn’t know)'}`);
  if(q.imgs&&q.imgs.length)L.push(withFig?'The question’s figure is pasted with this message. Read it before answering — the question is about it.':'This question has a diagram I can’t paste. Don’t guess what it shows; work from the text.');
  for(const r of q.refs||[]){
    if(r.t)L.push(`${r.k==='patton'?'The textbook says':r.k==='course'?'A file posted in my course (not by my lecturer) says':'My lecturer’s notes say'} (verbatim): “${r.t}” — ${r.src}`);
    else if(r.k==='slide')L.push(withFig?`My lecturer’s slide on this is pasted with this message — ${r.src}. Her wording on it is what earns the marks.`:`My lecturer’s slide on this: ${r.src} (an image, I can’t paste it).`);
  }
  if(hasHer(q)){const h=DATA.helpline[q.hl];L.push('','Her own worked answer for this topic, verbatim (her CAPITALS are the mark-earning words):',h.parts.map(p=>p.h+'\n'+p.t).join('\n'));}
  L.push('',aiSteps(you?'In one line, say what misconception my answer suggests.':'',`in the shape she uses (${AI_SHAPE[q.type]||'multiple choice'})`,'Stay inside this question and her notes. Don’t teach past them.',!!withFig&&aiFigures(q).length>0));
  return L.join('\n');
}
/* topic-first: the focus row's own `done` / `ask` / `cap` become the AI's brief,
   plus her worked helpline answer where she posted one */
function aiTopicPrompt(f){
  const L=[AI_CTX+` Topic: ${f.t} (${SYS[f.sys]||f.sys}).`,'','My lecturer set the level. Here is exactly what I have to be able to DO, in her words:',`“${f.done}”`,`How she asks it in tests: “${f.ask}”`];
  if(f.cap)L.push(`Where it ends — do NOT go past this: “${f.cap}”`);
  const h=(DATA.helpline||{})[f.id];
  if(h){let t=h.parts.map(p=>p.h+'\n'+p.t).join('\n');if(t.length>3000)t=t.slice(0,3000)+' …(trimmed)';
    L.push('','Her own worked answer for this topic, verbatim (her CAPITALS are the mark-earning words):',t);}
  L.push('',aiSteps('','in the shapes she uses (see “how she asks it” above)','Stay inside her level. Don’t teach past the “where it ends” line.'));
  return L.join('\n');
}
/* the question's own figures — or, when it has none, her slide (the build guarantees a
   question never carries both) — drawn onto ONE white png, each with its label, so a single
   paste lands every picture the AI needs. Same-origin images, so the canvas stays clean. */
function aiFigures(q){
  const f=[];
  for(const n of q.imgs||[])f.push({src:'img/'+n,label:q.imgs.length>1?'Question figure '+(f.length+1):'Question figure'});
  for(const r of q.refs||[])if(r.k==='slide'&&r.slide)f.push({src:'img/slides/'+r.slide,label:'My lecturer’s slide — '+r.src});
  return f;
}
function aiFigureBlob(q){
  const srcs=aiFigures(q); if(!srcs.length)return Promise.resolve(null);
  return Promise.all(srcs.map(s=>new Promise(res=>{const im=new Image();im.onload=()=>res({im,label:s.label});im.onerror=()=>res(null);im.src=s.src}))).then(all=>{
    const ok=all.filter(Boolean); if(!ok.length)return null;
    const PAD=16,LH=30,W=Math.min(1200,Math.max(...ok.map(x=>x.im.naturalWidth||900)));
    const rows=ok.map(x=>{const w=x.im.naturalWidth||900,h=x.im.naturalHeight||Math.round(w*0.7),s=Math.min(1,W/w);return {im:x.im,label:x.label,w:Math.round(w*s),h:Math.round(h*s)}});
    const c=document.createElement('canvas');c.width=W+PAD*2;c.height=rows.reduce((a,r)=>a+LH+r.h+PAD,PAD);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
    let y=PAD;for(const r of rows){g.fillStyle='#222';g.font='bold 17px system-ui,Segoe UI,sans-serif';g.fillText(r.label,PAD,y+20);y+=LH;g.drawImage(r.im,PAD+Math.round((W-r.w)/2),y,r.w,r.h);y+=r.h+PAD}
    return new Promise(res=>c.toBlob(res,'image/png'));
  });
}
/* copy: text + png in ONE clipboard item where the browser allows it (Chrome, Edge, Safari,
   Android Chrome), built inside the tap so Safari's gesture rule holds — the png is a promise
   because the figures are still being drawn. Anything else falls back to text only, and the
   text then says the picture could not come along. After a combined copy two small buttons
   let you re-copy just the text or just the figure, for an AI that keeps only one of them. */
function copyPrompt(btn,textFor,figP){
  const text=typeof textFor==='function'?textFor:()=>textFor;
  const done=(ok,fig)=>{btn.textContent=ok?(fig?'Copied ✓ prompt + figure — paste into Gemini (or any AI)':'Copied ✓ now paste it into Gemini (or any AI)'):'Copy blocked — select the text below and copy it';
    const nx=btn.nextElementSibling;
    if(!ok&&!(nx&&nx.classList.contains('aitext'))){const ta=document.createElement('textarea');ta.className='aitext';ta.readOnly=true;ta.value=text(false);btn.after(ta);ta.focus();ta.select()}
    if(fig&&!(nx&&nx.classList.contains('aisplit'))){const d=document.createElement('div');d.className='aisplit refsrc';d._btn=btn;
      d.innerHTML='Only one of them landed? <button class="btn ghost askai" data-aitext="1">📋 text only</button> <button class="btn ghost askai" data-aifig="1">🖼 figure only</button>';btn.after(d)}
    setTimeout(()=>btn.textContent=AI_LBL,4000)};
  const textOnly=()=>(navigator.clipboard?navigator.clipboard.writeText(text(false)):Promise.reject())
    .then(()=>done(true,false))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=text(false);ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}
      ta.remove();done(ok,false)});
  if(figP&&navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
    let item=null;
    try{item=new ClipboardItem({'text/plain':new Blob([text(true)],{type:'text/plain'}),'image/png':figP.then(b=>{if(!b)throw new Error('no figure');return b})})}catch(_){}
    if(item){navigator.clipboard.write([item]).then(()=>{btn._aiFig=figP;btn._aiText=text(true);done(true,true)}).catch(textOnly);return}
  }
  textOnly();
}
function aiSplitCopy(s){
  const b=s.closest('.aisplit')._btn, was=s.textContent, flash=t=>{s.textContent=t;setTimeout(()=>s.textContent=was,2500)};
  const p=s.dataset.aitext?navigator.clipboard.writeText(b._aiText):navigator.clipboard.write([new ClipboardItem({'image/png':b._aiFig})]);
  p.then(()=>flash('Copied ✓')).catch(()=>flash('Copy blocked'));
}
